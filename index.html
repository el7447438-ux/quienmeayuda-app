<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuiénMeAyuda</title><style>body{font:16px system-ui;margin:0;background:#f5f8f6;color:#18261e}main{max-width:620px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#176b4d}section{background:#fff;border:1px solid #dce7de;border-radius:14px;padding:20px;margin:18px 0}input,textarea,select,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:8px;border:1px solid #cbd9ce;font:inherit}button{background:#176b4d;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#176b4d;border:1px solid #176b4d}.hidden{display:none}.notice{padding:10px;background:#e7f4e9;border-radius:8px}.error{background:#fff0eb}small{color:#64736a}.request{border-top:1px solid #e2eae3;padding:12px 0}</style></head><body><main><header><h1>QuiénMeAyuda</h1><button id="logout" class="secondary hidden" style="width:auto">Salir</button></header><p>Servicios locales, cotizaciones y profesionales cerca de ti.</p><section id="auth"><h2>Crear cuenta o ingresar</h2><input id="name" placeholder="Nombre completo"><select id="role"><option value="client">Necesito ayuda</option><option value="professional">Ofrezco servicios</option></select><input id="email" type="email" placeholder="Correo electrónico" required><input id="password" type="password" minlength="8" placeholder="Contraseña (mínimo 8 caracteres)" required><button id="signup">Crear cuenta</button><button id="login" class="secondary">Ingresar</button><p id="message"></p></section><section id="app" class="hidden"><h2 id="welcome">Hola</h2><div id="client"><h3>Publicar una solicitud</h3><select id="category"></select><input id="title" placeholder="Título del servicio"><textarea id="description" placeholder="Describe lo que necesitas (mínimo 10 caracteres)"></textarea><input id="address" placeholder="Barrio o dirección de referencia"><button id="create">Publicar solicitud</button><h3>Mis solicitudes</h3><div id="requests"></div></div><div id="pro" class="hidden"><h3>Panel profesional</h3><p>Tu cuenta fue creada. Completa tu perfil desde el panel de administración para aparecer en búsquedas.</p></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://jcvywdnfbbobjllncroz.supabase.co','sb_publishable_tm6WI0bSBMVmj6inTL6P8A_AgxmuWgD');const $=id=>document.getElementById(id),msg=t=>{$('message').textContent=t};let profile;async function categories(){let{data}=await s.from('categories').select('id,name').eq('is_active',true).order('name');$('category').innerHTML=(data||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}async function requests(){let{data}=await s.from('service_requests').select('title,status,description,created_at').eq('client_id',profile.id).order('created_at',{ascending:false});$('requests').innerHTML=(data||[]).map(x=>`<div class=request><b>${x.title}</b><br><small>${x.status} · ${new Date(x.created_at).toLocaleDateString()}</small><br>${x.description}</div>`).join('')||'<small>Todavía no tienes solicitudes.</small>'}async function open(){let{data:{user}}=await s.auth.getUser();if(!user)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');let{data}=await s.from('profiles').select('*').eq('user_id',user.id).single();profile=data;if(!profile){msg('No pudimos cargar tu perfil.');return}$('welcome').textContent='Hola, '+profile.full_name;if(profile.role==='professional'){$('client').classList.add('hidden');$('pro').classList.remove('hidden')}else{await categories();await requests()}}$('signup').onclick=async()=>{let email=$('email').value,password=$('password').value,name=$('name').value;if(name.length<2)return msg('Escribe tu nombre completo.');let{error}=await s.auth.signUp({email,password,options:{data:{full_name:name,role:$('role').value}}});msg(error?error.message:'Revisa tu correo para confirmar la cuenta y luego ingresa.')};$('login').onclick=async()=>{let{error}=await s.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);open()};$('logout').onclick=()=>s.auth.signOut().then(()=>location.reload());$('create').onclick=async()=>{let title=$('title').value,description=$('description').value;if(title.length<3||description.length<10)return alert('Completa título y descripción.');let{error}=await s.from('service_requests').insert({client_id:profile.id,category_id:$('category').value,title,description,location_address:$('address').value||null});if(error)return alert(error.message);$('title').value='';$('description').value='';requests()};open();</script></body></html>
